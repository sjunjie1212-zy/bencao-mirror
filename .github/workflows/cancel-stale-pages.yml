name: Cancel stale Pages run

on:
  push:
    paths:
      - '.github/workflows/cancel-stale-pages.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages run #50
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/34977092287/cancel \
            || true
