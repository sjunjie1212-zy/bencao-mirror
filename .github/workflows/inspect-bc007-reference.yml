name: Inspect BC007 licensed source

on:
  push:
    branches: ["main"]
    paths:
      - 'data/bc007-reference-candidate.json'
      - '.github/workflows/inspect-bc007-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original Commons photo for human review only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bc007-reference
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          from pathlib import Path
          p=json.loads(Path('data/bc007-reference-candidate.json').read_text())
          title='File:'+p['source_file']
          url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode({'action':'query','titles':title,'prop':'imageinfo','iiprop':'url|size|extmetadata','format':'json'})
          req=urllib.request.Request(url,headers={'User-Agent':'BencaoMirrorReferenceAudit/1.0 (photographic source provenance review)'})
          with urllib.request.urlopen(req,timeout=45) as r: result=json.load(r)
          page=next(iter(result['query']['pages'].values()))
          image=page['imageinfo'][0]
          assert image['width']>=1500 and image['height']>=1400
          meta=image.get('extmetadata',{})
          license_name=meta.get('LicenseShortName',{}).get('value','')
          assert license_name.startswith(('CC BY-SA','CC BY ','CC0')), license_name
          req2=urllib.request.Request(image['url'],headers={'User-Agent':'BencaoMirrorReferenceAudit/1.0 (source verification)'})
          with urllib.request.urlopen(req2,timeout=100) as r:
              content=r.read(16000000)
          assert content[:3]==b'\xff\xd8\xff' and 20000<len(content)<16000000
          dest=Path('/tmp/bc007-reference')
          (dest/'source.jpg').write_bytes(content)
          (dest/'source-metadata.json').write_text(json.dumps({'file_page':p['source_page'],'license':license_name,'source_width':image['width'],'source_height':image['height'],'license_url':meta.get('LicenseUrl',{}).get('value'),'artist_metadata':meta.get('Artist',{}).get('value'),'description_metadata':meta.get('ImageDescription',{}).get('value'),'original_filename':p['source_file'],'image_url':image['url']},ensure_ascii=False,indent=2))
          print('Source downloaded for manual visual assessment, not published; dimensions',image['width'],image['height'])
          PY
      - name: Review-only reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: bc007-reference-review-only
          path: /tmp/bc007-reference/
          retention-days: 7
