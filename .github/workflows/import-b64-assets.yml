name: Import base64 visual assets

on:
  push:
    paths:
      - 'asset-import/*.b64-ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and import archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          markers=(asset-import/*.b64-ready)
          if [ ${#markers[@]} -eq 0 ]; then
            echo "No ready marker found."
            exit 0
          fi
          for marker in "${markers[@]}"; do
            name="$(tr -d '\r\n ' < "$marker")"
            parts=(asset-import/b64/"${name}".part-*)
            if [ ${#parts[@]} -eq 0 ]; then
              echo "No parts found for ${name}"
              exit 1
            fi
            archive="asset-import/${name}.zip"
            cat "${parts[@]}" | base64 --decode > "$archive"
            unzip -t "$archive"
            unzip -o "$archive" -d .
            rm -f "$archive" "$marker" "${parts[@]}"
          done
          rmdir asset-import/b64 2>/dev/null || true

      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images asset-import .github/workflows/import-b64-assets.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "assets: import base64 visual assets"
          git push
