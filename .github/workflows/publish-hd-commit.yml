name: Commit BENCAO HD final

on:
  push:
    branches: [publish-hd-final-run]
    paths:
      - '.github/workflows/publish-hd-commit.yml'

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load release transformer
        shell: bash
        run: |
          git fetch origin publish-hd-final-run
          git show origin/publish-hd-final-run:scripts/publish_hd_final.py > /tmp/publish_hd_final.py
          python3 /tmp/publish_hd_final.py

      - name: Validate JavaScript
        run: node --check app46.js

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app46.js index.html bencao-version.txt images/ASSET_INDEX.md
          git commit -m "release: publish 46-herb HD edition 4.0.0"
          git push origin HEAD:main

# rerun after specimen-array syntax fix
