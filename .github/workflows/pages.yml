name: Deploy BENCAO Mirror to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate BENCAO clean static bundle
        shell: bash
        run: |
          set -euo pipefail
          # Entry files present and non-empty
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s 404.html

          # No legacy base64 / part-split runtime
          test ! -e app-parts
          test ! -e css-parts
          test ! -e styles-loader.js
          if find . -name '*.b64' | grep -q .; then echo "legacy .b64 present" >&2; exit 1; fi

          # Six high-res hero WebP present with valid RIFF/WEBP magic
          for herb in bc001 bc002 bc003 bc004 bc005 bc006; do
            f="images/${herb}-hero-vf1.webp"
            test -s "$f"
            test "$(head -c 4 "$f")" = "RIFF"
            test "$(dd if="$f" bs=1 skip=8 count=4 status=none)" = "WEBP"
            test "$(stat -c%s "$f")" -gt 80000
          done

          # Version marker
          test -s bencao-version.txt

          # Aroma Field frozen rule guard
          grep -q "background-color:#e7dfd2" app.js
          grep -q "rgba(opening,.72)" app.js
          grep -q "rgba(middle,.68)" app.js
          grep -q "rgba(drydown,.64)" app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
