name: Deploy BENCAO Mirror to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate BENCAO public beta bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s beta.css
          test -s 404.html
          test -s bencao-version.txt

          test ! -e app-parts
          test ! -e css-parts
          test ! -e styles-loader.js
          if find . -name '*.b64' | grep -q .; then
            echo "legacy .b64 present" >&2
            exit 1
          fi

          for herb in bc001 bc002 bc003 bc004 bc005 bc006; do
            f="images/${herb}-hero-vf1.webp"
            test -s "$f"
            test "$(head -c 4 "$f")" = "RIFF"
            test "$(dd if="$f" bs=1 skip=8 count=4 status=none)" = "WEBP"
          done

          for pair in \
            'bc041-mugua' \
            'bc042-luohanguo' \
            'bc043-sangshen' \
            'bc044-suanzaoren' \
            'bc045-taoren'; do
            f="images/${pair}-hero-v1.avif"
            test -s "$f"
            head -c 32 "$f" | grep -a -q 'ftypavif'
          done

          test -s images/_manifests/manifest-bc041-bc045.csv

          # BC046 is intentionally hidden until all seven formal assets exist.
          # Once the import workflow removes published:false, Pages requires the full set.
          if ! grep -q "published:false,id:'bc046'" app.js; then
            for role in hero specimen detail-01 detail-02 detail-03 detail-04 detail-05; do
              f="images/bc046-cheqianzi-${role}-v1.avif"
              test -s "$f"
              head -c 32 "$f" | grep -a -q 'ftypavif'
            done
            test -s images/_manifests/manifest-bc046.csv
            test "$(($(wc -l < images/_manifests/manifest-bc046.csv)-1))" -eq 7
            grep -q '12 味可浏览本草' index.html
          fi

          grep -q 'PUBLIC BETA' index.html
          grep -q 'const LIVE_HERBS' app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
