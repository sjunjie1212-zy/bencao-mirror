name: Deploy BENCAO Mirror to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate BENCAO 46-herb HD bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app46.js
          test -s styles.css
          test -s beta.css
          test -s beta46.css
          test -s 404.html
          test -s bencao-version.txt

          test "$(cat bencao-version.txt)" = "4.0.0"
          grep -q '四十六味本草' index.html
          grep -q '46 味可浏览本草' index.html
          grep -q 'HD RELEASE' index.html
          grep -q 'app46.js' index.html
          grep -q "const VERSION='4.0.0'" app46.js
          grep -q 'LIVE_ASSET_SLUGS' app46.js

          test ! -e app-parts
          test ! -e css-parts
          test ! -e styles-loader.js
          if find . -name '*.b64' | grep -q .; then
            echo "legacy .b64 present" >&2
            exit 1
          fi

          for n in $(seq 1 6) $(seq 41 46); do
            id=$(printf 'bc%03d' "$n")
            grep -Fq "id:'${id}'" app46.js
          done
          for n in $(seq 7 40); do
            code=$(printf '%03d' "$n")
            grep -Fq "['${code}'" app46.js
          done

          for herb in bc001 bc002 bc003 bc004 bc005 bc006; do
            f="images/${herb}-hero-vf1.webp"
            test -s "$f"
            test "$(head -c 4 "$f")" = "RIFF"
            test "$(dd if="$f" bs=1 skip=8 count=4 status=none)" = "WEBP"
          done

          python3 - <<'PY'
          from pathlib import Path
          import json
          plan=json.loads(Path('data/commons-asset-plan.json').read_text(encoding='utf-8'))
          roles=['hero','specimen','detail-01','detail-02','detail-03','detail-04','detail-05']
          for h in plan['herbs']:
              for role in roles:
                  p=Path('images')/f"{h['id']}-{h['slug']}-{role}-v1.webp"
                  assert p.is_file() and p.stat().st_size >= 20000, p
          for n,slug in [(41,'mugua'),(42,'luohanguo'),(43,'sangshen'),(44,'suanzaoren'),(45,'taoren')]:
              for role in roles:
                  p=Path('images')/f'bc{n:03d}-{slug}-{role}-v1.avif'
                  assert p.is_file() and p.stat().st_size >= 20000, p
          print('46-herb HD validation passed')
          PY

          test -s images/_manifests/manifest-bc041-bc045.csv
          test -s images/_manifests/manifest-bc007-bc040-bc046.csv

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
