name: Deploy BENCAO Mirror to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate BENCAO static bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s styles-loader.js
          test -s css-parts/css-00.txt
          test -s css-parts/css-01.txt
          test -s css-parts/css-02.txt
          test -s app-parts/app-00.txt
          test -s app-parts/app-01.txt
          test -s app-parts/app-02.txt
          test -s app-parts/app-03.txt
          for herb in bc001 bc002 bc003 bc004 bc005 bc006; do
            test -s "assets/${herb}-direct.b64"
            base64 -d "assets/${herb}-direct.b64" > "/tmp/${herb}.webp"
            test "$(head -c 4 "/tmp/${herb}.webp")" = "RIFF"
            test "$(dd if="/tmp/${herb}.webp" bs=1 skip=8 count=4 status=none)" = "WEBP"
          done
          grep -q "background-color:#e7dfd2" css-parts/css-01.txt
          grep -q "rgba(opening,.72)" app-parts/app-01.txt
          grep -q "rgba(middle,.68)" app-parts/app-01.txt
          grep -q "rgba(drydown,.64)" app-parts/app-01.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
