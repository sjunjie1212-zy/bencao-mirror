name: Deploy BENCAO Mirror to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate BENCAO 46-herb public beta bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app46.js
          test -s styles.css
          test -s beta.css
          test -s beta46.css
          test -s 404.html
          test -s bencao-version.txt

          test ! -e app-parts
          test ! -e css-parts
          test ! -e styles-loader.js
          if find . -name '*.b64' | grep -q .; then
            echo "legacy .b64 present" >&2
            exit 1
          fi

          grep -q '四十六味本草' index.html
          grep -q '46 味可浏览本草' index.html
          grep -q 'app46.js' index.html

          # BC.001–006 and BC.041–046 are explicit objects.
          for n in $(seq 1 6) $(seq 41 46); do
            id=$(printf 'bc%03d' "$n")
            grep -Fq "id:'${id}'" app46.js
          done

          # BC.007–040 are generated from the compact pending-data table.
          for n in $(seq 7 40); do
            code=$(printf '%03d' "$n")
            grep -Fq "['${code}'" app46.js
          done

          for herb in bc001 bc002 bc003 bc004 bc005 bc006; do
            f="images/${herb}-hero-vf1.webp"
            test -s "$f"
            test "$(head -c 4 "$f")" = "RIFF"
            test "$(dd if="$f" bs=1 skip=8 count=4 status=none)" = "WEBP"
          done

          for pair in \
            'bc041-mugua' \
            'bc042-luohanguo' \
            'bc043-sangshen' \
            'bc044-suanzaoren' \
            'bc045-taoren'; do
            f="images/${pair}-hero-v1.avif"
            test -s "$f"
            head -c 32 "$f" | grep -a -q 'ftypavif'
          done

          test -s images/_manifests/manifest-bc041-bc045.csv
          grep -q 'PUBLIC BETA' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
