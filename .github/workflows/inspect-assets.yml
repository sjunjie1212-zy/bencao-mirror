name: Inspect image blob candidates
on:
  push:
    branches: ["asset-inspect"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Inspect candidates
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path('candidates').glob('*')):
              try:
                  im=Image.open(p)
                  print(f'{p}: format={im.format} size={im.size} mode={im.mode} bytes={p.stat().st_size}')
              except Exception as e:
                  print(f'{p}: NOT_IMAGE bytes={p.stat().st_size} error={e}')
          PY
