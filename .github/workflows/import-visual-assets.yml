name: Import visual assets

on:
  push:
    paths:
      - 'asset-import/*.zip'
      - 'asset-import/chunks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble chunked archive
        shell: bash
        run: |
          shopt -s nullglob
          parts=(asset-import/chunks/bc041-bc045.part-*)
          if [ ${#parts[@]} -gt 0 ]; then
            cat "${parts[@]}" > asset-import/bc041-bc045-formal.zip
            rm -rf asset-import/chunks
          fi

      - name: Import packaged assets
        shell: bash
        run: |
          shopt -s nullglob
          archives=(asset-import/*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No import archive found; nothing to do."
            exit 0
          fi
          for archive in "${archives[@]}"; do
            unzip -o "$archive" -d .
            rm -f "$archive"
          done
          if [ -f ASSET_IMPORT_MANIFEST.csv ]; then
            mkdir -p images/_manifests
            mv ASSET_IMPORT_MANIFEST.csv images/_manifests/manifest-bc041-bc045.csv
          fi

      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images asset-import .github/workflows/import-visual-assets.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "assets: import formal visual assets"
          git push
